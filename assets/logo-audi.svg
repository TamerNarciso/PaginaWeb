<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 76" fill="none" role="img" aria-label="Logo AUDI México">
  <!-- Four Interlocking Rings of Audi -->
  <g stroke="currentColor" stroke-width="4.2">
    <circle cx="42" cy="30" r="20" />
    <circle cx="74" cy="30" r="20" />
    <circle cx="106" cy="30" r="20" />
    <circle cx="138" cy="30" r="20" />
  </g>
  <!-- Subtle inner highlight ring for metallic precision -->
  <g stroke="#C84B31" stroke-width="1" stroke-opacity="0.35">
    <circle cx="42" cy="30" r="17.5" />
    <circle cx="74" cy="30" r="17.5" />
    <circle cx="106" cy="30" r="17.5" />
    <circle cx="138" cy="30" r="17.5" />
  </g>
  <text x="90" y="68" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2.5" fill="currentColor">AUDI MÉXICO</text>
</svg>
