<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 84" fill="none" role="img" aria-label="Logo BUAP Facultad de Ciencias de la Computación (FCC)">
  <!-- BUAP Institutional Circular Shield (#003B5C Navy & #00B5E2 Cyan) -->
  <g transform="translate(8, 6)">
    <circle cx="36" cy="36" r="34" fill="#003B5C" stroke="#00B5E2" stroke-width="2.5" />
    <circle cx="36" cy="36" r="28" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.5" />
    <!-- Inner Shield of Minerva & Phoenix Crest -->
    <path d="M22 20 H50 V37 C50 47 36 54 36 54 C36 54 22 47 22 37 Z" fill="#00B5E2" fill-opacity="0.2" stroke="#00B5E2" stroke-width="1.8" />
    <!-- Stylized Phoenix Wings / Flame above shield -->
    <path d="M26 22 Q36 12 46 22 Q36 18 26 22 Z" fill="#FFFFFF" />
    <!-- Binary / Computing Circuit Nodes inside Shield (FCC identity) -->
    <circle cx="31" cy="31" r="2.2" fill="#FFFFFF" />
    <circle cx="41" cy="31" r="2.2" fill="#00B5E2" />
    <circle cx="36" cy="40" r="2.5" fill="#FFFFFF" />
    <path d="M31 31 L36 40 L41 31" stroke="#00B5E2" stroke-width="1.6" />
    <text x="36" y="63" text-anchor="middle" font-family="monospace" font-size="6.5" font-weight="700" fill="#FFFFFF" letter-spacing="1">1578</text>
  </g>

  <!-- Typography: BUAP | FCC -->
  <g transform="translate(88, 18)">
    <text x="0" y="18" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="1.5" fill="#003B5C" class="buap-primary-text">BUAP</text>
    <rect x="68" y="3" width="2" height="18" fill="#00B5E2" />
    <text x="76" y="18" font-family="monospace" font-size="18" font-weight="700" fill="#00B5E2">FCC</text>
    <text x="0" y="33" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.6" fill="currentColor" opacity="0.85">FACULTAD DE CIENCIAS</text>
    <text x="0" y="44" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.6" fill="currentColor" opacity="0.85">DE LA COMPUTACIÓN</text>
  </g>
</svg>
